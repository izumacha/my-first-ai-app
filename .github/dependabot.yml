# Dependabot 設定: 依存関係の既知脆弱性・更新を毎週チェックして PR を作成する
# (CLAUDE.md「セキュリティ」の依存管理方針に基づく)
version: 2
updates:
  # package.json / package-lock.json の npm 依存 (Next.js / Anthropic SDK 等)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(deps)"
    groups:
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ (node 等)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(docker)"

  # .github/workflows/ で使う GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(ci)"
