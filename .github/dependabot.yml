# Dependabot 設定: 依存関係の既知脆弱性・更新を毎週チェックして PR を作成する
# (CLAUDE.md「セキュリティ」の依存管理方針に基づく)
version: 2
updates:
  # package.json / package-lock.json の npm 依存 (Next.js / Anthropic SDK 等)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(deps)"
    groups:
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint の major 更新 (9 → 10 以降) を保留する。
      #
      # なぜ止めるのか: 上流が未対応で、上げると lint が必ず落ちるため。
      #   eslint-config-next@16.3.0 は peerDependencies に `eslint: ">=9.0.0"` と
      #   書いており、npm は eslint 10 のインストールを許してしまう。しかし同 config が
      #   内包する eslint-plugin-react は最新 7.37.5 でも peer が `^9.7` までで、
      #   ESLint 10 で削除された `context.getFilename()` を呼ぶ。結果、設定を 1 行も
      #   変えていなくても実行時に
      #     TypeError: Error while loading rule 'react/display-name':
      #       contextOrFilename.getFilename is not a function
      #   で exit code 2 になる (Dependabot PR #39 の CI 失敗、および eslint@10.8.1 を
      #   入れてローカル再現済み)。アプリ側の eslint.config.mjs では回避できず、
      #   ESLint 10 対応版の eslint-plugin-react も現時点で存在しない。
      #   なお同じ lint 実行に載る eslint-plugin-react-hooks / typescript-eslint /
      #   eslint-import-resolver-typescript は既に eslint 10 を許しているため、
      #   現時点で保留を塞いでいるのは react (`^9.7`) / import (`^9`) / jsx-a11y (`^9`)
      #   の 3 つ。ただし後述のテストは「eslint に peer 依存を宣言している直接依存」
      #   全部を見張る (いま緩いものが将来狭まる可能性があり、
      #   外すと誤って保留解除を促すため)。
      #
      # 外す条件: eslint-config-next が引き込む eslint プラグイン **すべて**
      #   (eslint に peer 依存を宣言している直接依存) の peerDependencies が
      #   eslint 10 以上を含む版になったら、この ignore を削除して major 更新を取る。
      #   **ただしこれだけでは十分条件にならない** — @next/eslint-plugin-next のように
      #   peer 依存を宣言しないプラグインは同じ lint 実行に載るのに自動判定できない。
      #   テストが「出揃った」と言ってきたら、削除前にそれらを別途確認すること
      #   (この限界は tests/dependabot-eslint-guard.test.ts のコメントにも書いてある)。
      #   **react 1 つだけが対応しても外せない** — 同じ lint 実行に載る他のプラグインが
      #   eslint を 9 までに制限したままなら、結局 lint は落ちる。
      #   この条件は tests/dependabot-eslint-guard.test.ts が package-lock.json の
      #   解決済み peer 範囲を読んで自動で見張る。人が気付くのを待たずに、上流が
      #   eslint 10 に言及した時点でテストが落ちる (保留が効いている限り package.json の
      #   eslint は 9 のまま動かないので、「package.json を見る」判定だけでは
      #   この条件は永久に発火しない — 判定が循環してしまう)。
      #
      # 効き方: `version-update:semver-major` だけを対象にするので、9 系の
      #   minor / patch 更新は従来どおり npm-minor-and-patch グループで届く。
      #   ただし 9 系で修正されない脆弱性が出た場合はこの ignore ごと見直す必要があるため、
      #   放置ではなく「上流待ちの保留」として扱う (§9 依存の管理)。
      #
      # security updates との関係: `version-update:` 接頭辞の update-types は
      #   version updates 向けの指定で、Dependabot security updates には適用されない
      #   （したがって eslint に CVE が出れば、この ignore があっても security update の PR は
      #   届く）という理解でこの形にしている。**ただしこの環境からは docs.github.com へ
      #   到達できず裏取りできていない**ので、次の順序で扱うこと:
      #     1. CVE が出たらまず security update の PR が来るかを確認する。
      #     2. 来ないと分かった場合に限り、9 系へ修正が入っているならそれを取り込み、
      #        10 系にしか修正が無いなら保留の解除ごと(= lint の破損対応込みで)判断する。
      #   **CVE を見た時点で反射的にこの ignore を外さないこと** — 外すと eslint 10 が入り、
      #   上に書いた lint の破損をそのまま踏む。挙動を確認できたらこの段落を確定形に直す。
      #   参照: GitHub Docs の Dependabot options reference (ignore / update-types の節)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

      # @types/node の major 更新を保留する。
      #
      # なぜ止めるのか: `@types/node` の major は DefinitelyTyped の慣習として
      #   **Node 本体のリリース系列に対応する**。`@types/node@28` は「Node 28 の API 一覧」
      #   であって、Node 26 で動くコードの型チェックに使うものではない。
      #   そしてここがずれても **lint も型チェックも通ってしまう** — むしろ型が
      #   API の存在を主張するぶん、実行する Node に無い API を書いても
      #   `tsc --noEmit` が緑のまま通り、壊れるのは本番の実行時
      #   (`TypeError: x is not a function`) になる。**CI の緑が判断材料にならない
      #   fail-open** なので、バージョンの主導権を Dependabot ではなく
      #   「ランタイムを上げる判断」の側に置く。
      #
      # 外し方: これは「永久に major を上げない」という意味ではない。
      #   動かす Node を次の major へ上げるときは、**CLAUDE.md §3「実際に動かす Node の
      #   major は 5 か所で揃える」に挙げた場所すべて**をまとめて上げ、
      #   **同じ PR で `@types/node` も新しい major へ上げる**。ignore は残したままでよい。
      #   （場所の一覧をここへ書き写さないのは、写しの片方が古くなる形そのものを
      #     この保留が防ごうとしているため。一覧は CLAUDE.md と
      #     tests/node-runtime-alignment.test.ts が持つ）
      #
      # 効き方: `version-update:semver-major` だけを対象にするので、26 系の
      #   minor / patch 更新は従来どおり npm-minor-and-patch グループで届く。
      #
      # 整合性は tests/node-runtime-alignment.test.ts が機械的に見張る
      # (ピンの食い違い・型と実行時のずれ・この保留の消失/効きすぎ/置き場所間違い)。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dockerfile のベースイメージ (node 等)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(docker)"
    ignore:
      # node ベースイメージの major 更新を保留する（@types/node と同じ理由）。
      #
      # なぜ止めるのか: docker エコシステムが触るのは `Dockerfile` の
      #   `FROM node:<major>` だけで、`.nvmrc` も `package.json` の `engines.node` も
      #   README も動かない。つまりベースイメージだけの major 更新は「Node 26 で
      #   検証した成果物を、別 major の Node で動かす」差分になる。
      #   **バージョンの主導権は「ランタイムを上げる判断」の側に置く**
      #   （この保留が無いと、毎週立つ PR が
      #     tests/node-runtime-alignment.test.ts を赤にし続け、
      #     「赤いのが常態」になった検査はいずれ緩められる）。
      #
      # 効き方: major だけを止めるので、`node:26-alpine` のセキュリティ修正を含む
      #   イメージ更新（同じタグの再ビルド）や minor / patch の追従は従来どおり届く。
      #
      # 外し方: CLAUDE.md §3 の手順で Node を上げる PR の中で、この Dockerfile も
      #   一緒に上げる（ignore は残したままでよい）。
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # .github/workflows/ で使う GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる
      prefix: "chore(ci)"
