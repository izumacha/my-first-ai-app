name: CI

# デフォルトブランチ（main）への push と、すべての PR で検証を走らせる。
# docs/initial-project-setup は main を作る前に使っていた旧デフォルトブランチで、
# 当時のコミットを直接押した場合にも検証が動くよう対象に残している。
on:
  push:
    branches: [main, docs/initial-project-setup]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
