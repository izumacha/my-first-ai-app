name: CI

# デフォルトブランチ（main）への push と、すべての PR で検証を走らせる。
# docs/initial-project-setup は main を作る前に使っていた旧デフォルトブランチで、
# 当時のコミットを直接押した場合にも検証が動くよう対象に残している。
on:
  push:
    branches: [main, docs/initial-project-setup]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 検証に使う Node は **`.nvmrc` から読む**（ここに版を書き写さない）。
      # 以前は matrix [20, 22] を直書きしていて、Dockerfile が出荷する Node（26）を
      # 一度も検証していなかった。緑になるのは「その Node で動くから」ではなく
      # 「npm が engines を既定で強制しないから」でしかなく、CI の緑が判断材料に
      # ならない fail-open だった。版をここへ書き写すと同じずれがいつでも再発するので、
      # 参照にして食い違いようのない形にしてある
      # （詳細は tests/node-runtime-alignment.test.ts の冒頭コメント）。
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
