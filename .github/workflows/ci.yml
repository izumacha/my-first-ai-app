name: CI

# このリポジトリのデフォルトブランチは docs/initial-project-setup（main は存在しない）。
# 旧設定は main のみを対象にしていたため、push でも PR でも CI が一度も起動しなかった。
# デフォルトブランチへの push と、すべての PR で検証が走るようにする。
on:
  push:
    branches: [main, docs/initial-project-setup]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
